name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build android arm64
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: go build -buildmode=pie -trimpath -ldflags "-s -w" -o dist/mobile-agent-android-arm64 ./cmd/mobile-agent

      - name: Build linux arm64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o dist/mobile-agent-linux-arm64 ./cmd/mobile-agent

      - name: Build linux amd64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o dist/mobile-agent-linux-amd64 ./cmd/mobile-agent

      - name: Package
        run: |
          cp LICENSE README.md dist/
          tar -czf mobile-agent-android-arm64.tar.gz -C dist mobile-agent-android-arm64 LICENSE README.md
          tar -czf mobile-agent-linux-arm64.tar.gz -C dist mobile-agent-linux-arm64 LICENSE README.md
          tar -czf mobile-agent-linux-amd64.tar.gz -C dist mobile-agent-linux-amd64 LICENSE README.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mobile-agent-android-arm64.tar.gz
            mobile-agent-linux-arm64.tar.gz
            mobile-agent-linux-amd64.tar.gz
          generate_release_notes: true
